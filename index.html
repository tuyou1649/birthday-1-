<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Little Birthday Universe ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
  --pink: #f5b9d8;
  --light-pink: #ffe2ef;
  --purple: #9d7bc1;
  --deep: #211735;
  --cream: #fff2df;
  --gold: #ffe3a6;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

html, body {
  width: 100vw; height: 100dvh; overflow: hidden;
  background: #211735; color: var(--cream); font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; }

/* ================= 页面切换与布局 ================= */
.page { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.page.active { display: block; animation: pageTurn .6s cubic-bezier(0.25, 1, 0.5, 1) both; }
.page.active.flex-page { display: flex; flex-direction: column; }
@keyframes pageTurn { from { opacity: 0; transform: perspective(1200px) rotateY(-15deg) scale(0.95); } to { opacity: 1; transform: perspective(1200px) rotateY(0deg) scale(1); } }

.star-background {
  background-color: #211735;
  background-image: radial-gradient(#fff0ce 1px, transparent 1px), radial-gradient(#bda3e6 1px, transparent 1px), radial-gradient(ellipse at 50% 20%, #49335e 0%, #211735 75%);
  background-size: 43px 43px, 71px 71px, 100% 100%;
  background-position: 0 0, 20px 30px, 0 0;
}
.scroll-container { width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }

/* ================= 1. 验证入口 ================= */
#entryPage { align-items: center; justify-content: center; padding: 25px 15px; }
.phone { width: 100%; max-width: 340px; padding: 17px; background: #f5c5df; border: 5px solid #ffe7f3; border-radius: 30px; box-shadow: 0 0 0 5px #a77ab4, 0 15px 45px #100a20; position: relative; }
.phone-camera { width: 42px; height: 6px; border-radius: 10px; background: #b27fa9; margin: 0 auto 18px; }
.phone-screen { background: #342449; border: 3px solid #9b73ae; min-height: 450px; padding: 25px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.phone-screen .english { font-size: 9px; letter-spacing: 1.5px; color: #ffbfe1; line-height: 2; }
.phone-decoration { font-size: 32px; color: #ffe1a8; margin: 12px 0; }
.phone-screen h1 { font-size: 22px; line-height: 1.6; color: #ffe1ef; margin: 16px 0; text-shadow: 2px 2px #805184; }
.phone-screen .question { font-size: 12px; line-height: 2; color: #e7d9f1; margin: 12px 0 20px; }
.year-display { height: 48px; width: 100%; border: 2px solid #f2b7da; background: #211735; color: #ffe1ef; font-size: 23px; letter-spacing: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 17px; }
.number-pad { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; gap: 9px; }
.number-pad button { height: 45px; border: 2px solid #f6c6e1; border-radius: 5px; background: #73527f; color: white; font-size: 17px; box-shadow: 3px 3px 0 #1b1129; }
.number-pad button:active { transform: translate(2px, 2px); box-shadow: none; }
.number-pad .special { background: #a77ba8; font-size: 12px; }
.enter-button { width: 100%; padding: 13px; margin-top: 13px; background: #f3bddb; color: #503455; border: 2px solid #fff0f8; font-weight: bold; font-size: 13px; box-shadow: 4px 4px 0 #17102a; }
.reset-btn { width: 100%; padding: 10px; margin-top: 15px; background: transparent; color: #ff9a9e; border: 2px dashed #ff9a9e; border-radius: 5px; font-size: 11px; transition: 0.2s; }
.reset-btn:active { background: rgba(255,154,158,0.2); }
.phone-status { min-height: 25px; margin-top: 14px; font-size: 11px; color: #ffcae7; line-height: 1.7; }

#successOverlay { display: none; position: absolute; inset: 0; z-index: 100; background: #211735; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 25px; }
#successOverlay.show { display: flex; animation: pageTurn .5s ease; }
.success-heart { font-size: 65px; animation: heartbeat .8s infinite alternate; }
@keyframes heartbeat { to { transform: scale(1.2); } }
#successOverlay h2 { color: #ffd8ec; font-size: 25px; }
#successOverlay p { color: #e9d5f0; font-size: 13px; line-height: 2; }
#successOverlay button { margin-top: 20px; padding: 14px 25px; background: #f4bddc; border: 2px solid white; color: #4d3355; font-weight: bold; box-shadow: 4px 4px 0 #100a20; }

/* ================= 2. 大厅 ================= */
.guide { width: 100%; max-width: 650px; padding: 25px 17px 50px; margin: auto; position: relative; }
.hero { text-align: center; padding: 30px 5px; }
.hero-moon { font-size: 47px; color: var(--gold); animation: float 2.5s infinite ease-in-out; }
@keyframes float { 50% { transform: translateY(-8px); } }
.pixel-en { font-family: monospace; color: #ffbddd; font-size: 10px; letter-spacing: 1.5px; line-height: 2; }
.hero h1 { font-size: clamp(21px, 5vw, 29px); line-height: 1.7; color: #ffe4f1; text-shadow: 3px 3px #79518b; margin: 15px 0; }
.hero p { font-size: 13px; line-height: 2.1; color: #e9d9f4; }
.hero-stars { color: #ffdda4; margin-top: 20px; letter-spacing: 9px; }
.panel { background: #302149; border: 3px solid #b28ac8; border-radius: 5px; padding: 18px; box-shadow: 5px 5px 0 #120b20; }
.section { margin-top: 35px; }
.section-title { text-align: center; font-size: 17px; color: #ffd3eb; margin-bottom: 20px; text-shadow: 2px 2px #79518b; }

.birthday-panel { text-align: center; background: #3d285c; }
.birthday-panel .label { color: #ffbfe1; font-size: 11px; letter-spacing: 2px; }
.birthday-panel p { font-size: 12px; margin: 15px 0; }
.countdown { display: flex; align-items: center; justify-content: center; gap: 7px; }
.countdown div { min-width: 48px; background: #211735; border: 2px solid #f0b9db; padding: 9px 4px; display: flex; flex-direction: column; }
.countdown strong { font-size: 21px; color: #ffe1a9; }
.countdown small { font-size: 10px; color: #e6c8e8; margin-top: 5px; }
.countdown > span { color: #ffc8e5; font-size: 18px; }
.birthday-note { color: #ffcee9; font-size: 11px !important; margin-bottom: 0 !important; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat { text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 16px 7px; transition: 0.2s; }
.stat.clickable { cursor: pointer; border-color: #ffb9dc; }
.stat.clickable:active { transform: scale(0.95); }
.stat span { font-size: 24px; }
.stat strong { font-size: 22px; color: #ffe0a6; }
.stat small { font-size: 11px; color: #d8c5e8; }

.hint { text-align: center; font-size: 11px; color: #cbb8df; margin: -7px 0 18px; }
.game-list { display: flex; flex-direction: column; gap: 13px; }
.game-card { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 12px; color: white; text-align: left; background: #302149; border: 2px solid #9d79b8; box-shadow: 4px 4px 0 #120b20; border-radius: 5px; }
.game-card.unlocked { border-color: #ffb9dc; background: #49305f; }
.game-card.locked { opacity: .65; }
.game-card.shake { animation: shake .4s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.game-icon { width: 48px; height: 48px; display: grid; place-items: center; background: #624375; border: 2px solid #bd91cb; font-size: 25px; flex-shrink: 0; position: relative; }
.game-icon.cleared::after { content: "✓"; position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; background: #ffe0a6; color: #4b2f55; font-size: 11px; font-weight: bold; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid #4b2f55; }
.game-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.game-info small { color: #ffbfe1; font-size: 9px; }
.game-info strong { font-size: 13px; }
.game-info span { color: #d8c5e8; font-size: 10px; line-height: 1.7; }
.arrow { color: #ffcee9; font-size: 16px; }

.extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.extra-card { padding: 20px 8px; background: #392653; color: #fff0f8; border: 2px solid #b58acb; box-shadow: 4px 4px 0 #17102e; display: flex; flex-direction: column; align-items: center; gap: 9px; }
.extra-card span { font-size: 29px; }
.extra-card strong { font-size: 13px; }
.extra-card small { font-size: 10px; color: #d7c6e9; text-align: center; }

.music { text-align: center; margin-top: 35px; }
.music button { padding: 12px 22px; color: #ffe6f4; background: #58376f; border: 2px solid #f2b8dc; box-shadow: 4px 4px 0 #17102e; font-size: 12px; }
.music p { color: #cbb7dd; font-size: 10px; margin-top: 15px; }
.footer { text-align: center; margin-top: 40px; color: #c6a4d8; font-size: 10px; letter-spacing: 1px; line-height: 2.5; }
.footer p { color: #ffcae8; font-size: 12px; }

/* ================= 3. 时间轴 ================= */
.timeline-page-inner { width: 100%; max-width: 580px; margin: 0 auto; padding: 30px 17px 70px; position: relative; z-index: 1; }
.timeline-back { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; background: #49305f; border: 2px solid #f2b8dc; color: #ffe6f4; font-size: 11px; box-shadow: 3px 3px 0 #120b20; margin-bottom: 25px; }
.timeline-hero { text-align: center; margin-bottom: 45px; }
.timeline-hero .pixel-en { color: #ffbfe1; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 2px; }
.timeline-hero h1 { font-size: clamp(20px, 5vw, 26px); color: #ffe4f1; text-shadow: 3px 3px #79518b; margin: 14px 0 10px; line-height: 1.5; }
.timeline-hero p { font-size: 12px; color: #e3d3f0; line-height: 2; margin: 0; letter-spacing: .5px; }
.timeline-axis { position: relative; padding-left: 34px; }
.timeline-axis::before { content: ""; position: absolute; left: 14px; top: 5px; bottom: 20px; width: 2px; background: repeating-linear-gradient(to bottom, #f2b8dc 0 6px, transparent 6px 12px); opacity: .7; }
.tl-chapter { position: relative; margin-bottom: 46px; opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
.tl-chapter.visible { opacity: 1; transform: translateY(0); }
.tl-chapter::before { content: ""; position: absolute; left: -27px; top: 22px; width: 13px; height: 13px; background: #f4b9dc; border: 2px solid #ffe4f1; border-radius: 50%; box-shadow: 0 0 0 3px #211735, 0 0 12px #f4b9dc; }
.tl-chapter.tbc::before { background: #211735; border-color: #ffe3a6; box-shadow: 0 0 0 3px #211735, 0 0 14px #ffe3a6; }
.tl-card { background: #fff2df; color: #4b3053; padding: 14px 14px 24px; border-radius: 2px; box-shadow: 4px 4px 0 #120b20, 0 12px 30px rgba(0,0,0,.45); transform: rotate(-1.3deg); transition: transform .35s ease; }
.tl-chapter:nth-child(even) .tl-card { transform: rotate(1.3deg); }
.tl-card:hover { transform: rotate(0deg); }
.tl-year-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 3px; }
.tl-year { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #a3517f; letter-spacing: .5px; }
.tl-en { font-family: 'Press Start 2P', monospace; font-size: 7px; color: #b97795; letter-spacing: .5px; text-align: right; max-width: 55%; line-height: 1.5; }
.tl-photos { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 12px; }
.tl-photos.multi { grid-template-columns: 1fr 1fr; }
.tl-photos.multi .tl-photo:last-child:nth-child(odd) { grid-column: 1 / -1; max-width: 60%; margin: 0 auto; }
.tl-photo { width: 100%; aspect-ratio: 4 / 3; background: #e8d8e8; border: 2px solid #d4b8d0; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
.tl-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tl-photo.placeholder { background: repeating-linear-gradient(45deg, #efe0ef 0 8px, #e8d8e8 8px 16px); color: #b98fb0; font-size: 10px; text-align: center; line-height: 1.6; padding: 8px; }
.tl-photo.placeholder::before { content: "✦ ♡ ✦"; display: block; font-size: 20px; margin-bottom: 6px; color: #c9a5c0; }
.tl-text { font-size: 12.5px; line-height: 2; color: #5a3a63; padding: 0 4px; text-align: justify; }
.tl-chapter.tbc { margin-bottom: 30px; }
.tl-chapter.tbc .tl-card { background: #fffaf0; transform: rotate(0deg); padding: 20px 16px 28px; text-align: center; }
.tl-chapter.tbc .tl-year-row { justify-content: center; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.tl-chapter.tbc .tl-en { text-align: center; max-width: 100%; }
.tl-blank-photo { width: 100%; aspect-ratio: 4 / 3; background: #fffaf5; border: 2px dashed #d9c0d4; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; position: relative; overflow: hidden; }
.tl-blank-photo img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
.tl-blank-photo::after { content: "?"; font-family: 'Press Start 2P', monospace; font-size: 32px; color: #fff; opacity: .8; position: absolute; bottom: 10px; right: 15px; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
.tl-tbc-en { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #a3517f; letter-spacing: 1px; line-height: 2; margin: 8px 0 14px; padding: 0 6px; }
.tl-tbc-zh { font-size: 12px; color: #6b456f; line-height: 1.9; padding: 0 6px; }

/* ================= 4. 游戏通用 ================= */
.game-topbar { width: 100%; max-width: 600px; padding: 15px; display: flex; justify-content: space-between; z-index: 10; }
.score-box, .time-box { background: #302149; border: 2px solid #b28ac8; padding: 8px 15px; box-shadow: 3px 3px 0 #120b20; font-family: 'Press Start 2P', monospace; font-size: 12px; color: #ffe0a6; }
.time-box { color: #ffbddd; }
.overlay { position: absolute; inset: 0; background: rgba(33,23,53,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
.overlay.hidden { display: none; }
.pixel-title { font-family: 'Press Start 2P', monospace; color: #ffbddd; font-size: 18px; line-height: 1.5; margin-bottom: 15px; text-shadow: 2px 2px #79518b; }
.overlay p { font-size: 13px; line-height: 1.8; color: #e9d5f0; margin-bottom: 25px; }
.btn { padding: 15px 30px; background: #f3bddb; color: #503455; border: 2px solid #fff0f8; font-weight: bold; font-size: 14px; box-shadow: 4px 4px 0 #17102a; cursor: pointer; transition: 0.1s; margin-top: 15px; z-index: 25;}
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #17102a; }

/* ================= 5. 第一关（爱心收集） ================= */
#gamePage1 { background: #211735; }
#gamePage1.active { display: flex; flex-direction: column; align-items: center; }
#gameArea1 { flex: 1; width: 100%; max-width: 600px; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
#gameArea1:active { cursor: grabbing; }
/* ⭐ 篮子变大变高了 ⭐ */
#basket { 
  width: 80px; 
  height: 80px; 
  position: absolute; 
  bottom: 50px; 
  left: 50%; 
  font-size: 55px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  z-index: 5; 
  pointer-events: none; 
  filter: drop-shadow(0 0 15px #f5b9d8); 
}
.item { position: absolute; top: -50px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 4; pointer-events: none; }
.popup-text { position: absolute; font-family: 'Press Start 2P', monospace; font-size: 14px; font-weight: bold; pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 6; }
@keyframes floatUp { to { transform: translateY(-40px); opacity: 0; } }
.shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

/* ================= 6. 第二关（甜蜜蛋糕） ================= */
#gamePage2 { background: #2b1a3e; }
#gamePage2.active { display: flex; flex-direction: column; align-items: center; }
.task-box { background: #51356d; border: 3px solid #ffbddd; border-radius: 8px; padding: 15px; box-shadow: 4px 4px 0 #170f24; font-size: 14px; color: #fff; transition: 0.3s; font-weight: bold; letter-spacing: 1px; }
.task-box b { color: #ffe3a6; font-size: 18px; margin: 0 5px; font-family: 'Press Start 2P', monospace; }
.task-box.flash { animation: flash 0.5s; border-color: #fff; box-shadow: 0 0 15px #ffbddd; }
@keyframes flash { 50% { background: #69428c; } }
#bubbleArea { flex: 1; width: 100%; max-width: 600px; position: relative; overflow: hidden; }
.bubble { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset -8px -8px 0px rgba(0,0,0,0.1), inset 8px 8px 0px rgba(255,255,255,0.7), 0 5px 10px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.1s; animation: float 3s infinite ease-in-out alternate; border: 2px solid rgba(255,255,255,0.4); }
.bubble:active { transform: scale(0.9); }
.bubble::after { content: ""; position: absolute; top: 15%; left: 15%; width: 20%; height: 20%; border-radius: 50%; background: rgba(255,255,255,0.9); }
.bubble.pink { background: radial-gradient(circle at 30% 30%, #ffd6e8, #ff9cc4); }
.bubble.yellow { background: radial-gradient(circle at 30% 30%, #fff6ca, #ffdb7d); }
.bubble.blue { background: radial-gradient(circle at 30% 30%, #d6efff, #82cdf5); }
.pop-particle { position: absolute; border-radius: 50%; pointer-events: none; background: #fff; animation: popAnim 0.3s ease-out forwards; z-index: 20; }
@keyframes popAnim { to { transform: scale(2.5); opacity: 0; } }

.cake-area { width: 100%; max-width: 600px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 30px; position: relative; z-index: 5; }
.cake { width: 260px; height: 190px; position: relative; transition: 0.5s; filter: drop-shadow(0 8px 7px rgba(0,0,0,.22)); }
.cake::after { content: ""; position: absolute; bottom: -17px; left: -25px; width: 310px; height: 27px; background: linear-gradient(180deg,#fff0f6 0%,#ffc9df 65%,#e99cbd 100%); border-radius: 50%; box-shadow: inset 0 3px 0 rgba(255,255,255,.95), inset 0 -5px 0 #d58eae, 0 10px 15px rgba(0,0,0,.35); border: 2px solid #fff7fb; z-index: 1; }
.cake-body { position: absolute; left: 0; bottom: 9px; width: 260px; height: 91px; background: linear-gradient(90deg,#e9a9a9 0%,#ffe0d0 16%,#f8d0bd 50%,#e9a9a9 100%); border-radius: 17px 17px 14px 14px; z-index: 2; overflow: visible; border: 3px solid #d49cb8; box-shadow: inset 9px 0 0 rgba(255,255,255,.35), inset -10px 0 0 rgba(151,83,112,.12), inset 0 -8px 0 rgba(196,126,139,.16); }
.cake-cream { position: absolute; top: -5px; left: -2px; width: calc(100% + 4px); height: 28px; background: linear-gradient(180deg,#fffdf6,#ffeeda); border: 2px solid #fff8ef; border-radius: 15px 15px 12px 12px; box-shadow: 0 4px 0 #e8cdbd; z-index: 3; }
.cake-cream::before { content: ""; position: absolute; left: 23px; top: 16px; width: 24px; height: 29px; background: #fff1dc; border-radius: 0 0 13px 13px; box-shadow: 0 3px 0 #e8cdbd; }
.cake-cream::after { content: ""; position: absolute; right: 29px; top: 15px; width: 20px; height: 39px; background: #fff1dc; border-radius: 0 0 12px 12px; box-shadow: 0 3px 0 #e8cdbd; }
.cake-top-tier { position: absolute; z-index: 4; width: 158px; height: 65px; left: 51px; top: 27px; border: 3px solid #d49cb8; border-radius: 15px 15px 10px 10px; background: linear-gradient(90deg,#e9b0b4,#fff0df 20%,#f8d7c8 78%,#e6a3b0); box-shadow: inset 7px 0 0 rgba(255,255,255,.35), inset -7px 0 0 rgba(151,83,112,.12); }
.cake-top-tier::before { content: ""; position: absolute; left: -3px; right: -3px; top: -7px; height: 22px; border: 2px solid #fff9ef; border-radius: 50% 50% 9px 9px; background: linear-gradient(180deg,#fffefa,#ffeeda); box-shadow: 0 4px 0 #e8cdbd; }
.cake-top-tier::after { content: ""; position: absolute; left: 22px; top: 9px; width: 17px; height: 25px; border-radius: 0 0 10px 10px; background: #fff0dc; box-shadow: 0 3px 0 #e8cdbd; }
.cake-candle { position: absolute; z-index: 7; width: 10px; height: 34px; left: 125px; top: -8px; border: 2px solid #d58cac; border-radius: 3px; background: repeating-linear-gradient(135deg,#fff 0 5px,#f4a6c5 5px 9px); }
.cake-candle::before { content: ""; position: absolute; width: 12px; height: 17px; left: -3px; top: -18px; background: #ffd36f; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 0 12px rgba(255,211,111,.65); }
.cake-strawberry { position: absolute; z-index: 6; top: 18px; font-size: 23px; line-height: 1; filter: drop-shadow(1px 2px 1px rgba(100,50,70,.25)); }
.cake-strawberry.left { left: 17px; transform: rotate(-15deg); }
.cake-strawberry.right { right: 17px; transform: rotate(15deg); }
.cake-pearl { position: absolute; z-index: 6; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 30% 25%,#fff 0 18%,#ffe7f0 45%,#e8a4c1 100%); box-shadow: 0 1px 2px rgba(110,60,90,.25); }
